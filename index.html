<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>瑪奇農場模型｜素質搜尋（美化版）</title>
<style>
  :root {
    /* Autumn vibes */
    --bg-top:#0b0c0f; --bg-btm:#11131a;
    --panel:#13161f; --card:#161a24;
    --muted:#aeb6c3; --text:#f3f5fa;
    --accent:#ff9d66; --accent-2:#ffd166;
    --ring:#6b7280;
    --chip-bg:#1b2230; --chip-active:#ffb86b;
    --badge-bg:#ffe8c9; --badge-text:#3b1f06; /* high-contrast number badge */
    --table-row:#0f1420; --table-row-alt:#0d111a;
    --border:rgba(255,255,255,.08);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:linear-gradient(180deg,var(--bg-top),var(--bg-btm));
    color:var(--text); font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Noto Sans, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .layout { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:22px; max-width:1400px; margin:0 auto; }
  .side, .main { background:var(--panel); border:1px solid var(--border); border-radius:18px; }
  .side { padding:16px; position:sticky; top:16px; height:calc(100vh - 32px); overflow:auto; }
  .main { padding:16px; position:relative; }
  .title { font-weight:800; font-size:20px; margin-bottom:12px; letter-spacing:.3px; }
  .muted { color:var(--muted); font-size:12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  input[type="text"], select {
    width:100%; padding:12px 12px; border:1px solid #23252c; background:#0f1117; color:var(--text); border-radius:12px; outline:none;
  }
  input[type="text"]:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,157,102,.25); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--chip-bg); border:1px solid var(--border); padding:7px 12px; border-radius:999px; font-size:12px; cursor:pointer; user-select:none; -webkit-user-select:none; transition:transform .06s ease, box-shadow .2s ease, border-color .2s ease; }
  .chip:hover { border-color:var(--chip-active); transform: translateY(-1px); }
  .chip.active { border-color:var(--chip-active); box-shadow:0 0 0 3px rgba(255,184,107,.2); }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:12px 0; position:relative; z-index:5; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:#0f1117; padding:6px 10px; border-radius:999px; font-size:12px; color:#e8edf9; }
  .btn { appearance:none; border:none; background:linear-gradient(135deg,var(--accent),#ff7e5f); color:#111; font-weight:800; padding:10px 14px; border-radius:12px; cursor:pointer; }
  .btn.sec { background:#22262f; color:#cfd6e6; }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; overflow:hidden; border-radius:12px; }
  thead th { position:sticky; top:0; background:linear-gradient(180deg,#151b27,#121722); z-index:1; color:#cfe2ff; text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  tbody td { padding:10px 12px; border-bottom:1px dashed var(--border); }
  tbody tr:nth-child(odd){ background:var(--table-row-alt); }
  tbody tr:nth-child(even){ background:var(--table-row); }
  tbody tr:hover { background:#1a2130; }
  .ability { font-size:12px; padding:3px 9px; border-radius:999px; background:var(--badge-bg); color:var(--badge-text); border:1px solid rgba(0,0,0,.05); cursor:pointer; font-weight:800; box-shadow:0 1px 0 rgba(0,0,0,.25), 0 0 0 3px rgba(255,209,102,.18); }
  .ability:hover { box-shadow:0 1px 0 rgba(0,0,0,.25), 0 0 0 3px rgba(255,209,102,.34); }
  .righthead { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; position:relative; z-index:5; }
  .pagination { display:flex; gap:8px; align-items:center; position:relative; z-index:5; }
  .pgbtn { padding:8px 12px; border-radius:10px; background:#20242c; color:#f2f6ff; border:1px solid var(--border); cursor:pointer; pointer-events:auto; font-weight:700; }
  .pgbtn[disabled] { opacity:.45; cursor:not-allowed; }
  #pagejump { width:70px; }
  #tablewrap { position:relative; z-index:1; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="title">篩選</div>
    <div class="field">
      <label for="mode">模式</label>
      <select id="mode" title="選擇查詢模式" aria-label="選擇查詢模式">
        <option value="name">搜尋名稱</option>
        <option value="ability">點選能力→找出有哪些道具</option>
      </select>
    </div>
    <div class="field" id="nameBox">
      <label for="q">名稱關鍵字（支援多關鍵字空白分隔）</label>
      <input id="q" type="text" placeholder="例：妖精 速度" aria-label="名稱關鍵字">
    </div>
    <div class="field">
      <label for="sheet">資料表（工作表）</label>
      <select id="sheet" title="選擇工作表" aria-label="選擇工作表"></select>
    </div>
    <div class="field" id="abilityBox" style="display:none;">
      <label>點選能力（可多選）</label>
      <div class="chips" id="abilityChips" aria-label="能力選擇區"></div>
      <div class="field" style="margin-top:10px;">
        <label for="logic">多選邏輯</label>
        <select id="logic" title="多選邏輯" aria-label="多選邏輯">
          <option value="AND">同時具備（AND）</option>
          <option value="OR">任一具備（OR）</option>
        </select>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="righthead">
      <div class="title">結果</div>
      <div class="pill" id="stats" aria-live="polite">0 筆</div>
    </div>
    <div class="toolbar">
      <div class="pill">提示：點表格中的能力標籤可直接加入篩選</div>
      <button id="clear" class="btn sec" aria-label="清空篩選">清空篩選</button>
    </div>
    <div id="tablewrap"></div>
    <div class="toolbar" style="justify-content:flex-end;">
      <div class="pagination">
        <button id="prev" class="pgbtn" disabled aria-label="上一頁">← 上一頁</button>
        <span id="pageinfo" aria-live="polite"></span>
        <button id="next" class="pgbtn" disabled aria-label="下一頁">下一頁 →</button>
        <span class="muted">跳至</span>
        <input id="pagejump" type="number" min="1" value="1" aria-label="跳至頁碼">
        <button id="go" class="pgbtn" aria-label="前往頁碼">GO</button>
      </div>
    </div>
  </main>
</div>

const META_IGNORE = new Set(["名稱","外服","台服"]);
let activeSheet = DATA.sheetNames[0] || null;
let mode = "name";
let selectedAbilities = new Set();
let logicMode = "AND";
let filtered = [];
let page = 1;

function uniq(arr){ return Array.from(new Set(arr)); }
function isTruthy(v){
  if(v===null || v===undefined) return false;
  if(typeof v === 'number') return v !== 0;
  const s = String(v).trim();
  if(s === "" || s === "0") return false;
  return true;
}
function tokenize(q){ return q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function rowHasAbilities(row, abilities, logicMode){
  const checks = Array.from(abilities).map(ab => isTruthy(row[ab]));
  if(abilities.size===0) return true;
  return logicMode === "AND" ? checks.every(Boolean) : checks.some(Boolean);
}
function buildAbilityList(cols){
  const pick = cols.filter(c => !META_IGNORE.has(c) && !/^Unnamed/i.test(c));
  const chips = document.getElementById('abilityChips');
  chips.innerHTML = "";
  pick.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'chip';
    btn.textContent = c;
    btn.dataset.key = c;
    btn.setAttribute('role','button');
    btn.setAttribute('tabindex','0');
    const toggle = () => {
      if(selectedAbilities.has(c)) selectedAbilities.delete(c);
      else selectedAbilities.add(c);
      btn.classList.toggle('active');
      update();
    };
    btn.addEventListener('click', toggle);
    btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(); }});
    chips.appendChild(btn);
  });
}
function buildTable(rows){
  if(!rows || rows.length===0) return '<div class="muted">沒有資料。</div>';
  const allCols = Array.from(new Set(rows.flatMap(r => Object.keys(r))));
  const commonCols = allCols.filter(c => c==="名稱" || selectedAbilities.has(c)).concat(
    allCols.filter(c => !META_IGNORE.has(c) && !selectedAbilities.has(c) && !/^Unnamed/i.test(c)).slice(0,6)
  );
  const cols = uniq(commonCols);
  const head = '<tr>' + cols.map(c => `<th scope="col">${escapeHtml(c)}</th>`).join('') + '</tr>';
  const body = rows.map(r => {
    return '<tr>' + cols.map(c => {
      const v = r[c] ?? '';
      if(c!=="名稱" && isTruthy(v)){
        return `<td><button class="ability" data-key="${escapeHtml(c)}" title="加入能力篩選">${escapeHtml(v)}</button></td>`;
      }
      return `<td>${escapeHtml(v)}</td>`;
    }).join('') + '</tr>';
  }).join('');
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

function currentRows(){
  const rows = DATA.sheets[activeSheet] || [];
  if(mode === "name"){
    const tokens = tokenize(document.getElementById('q').value);
    return rows.filter(r => {
      const joined = Object.values(r).map(v => (v===null||v===undefined?'':String(v))).join(' ').toLowerCase();
      return tokens.every(t => joined.includes(t));
    });
  }else{
    return rows.filter(r => rowHasAbilities(r, selectedAbilities, logicMode));
  }
}

function update(){
  filtered = currentRows();
  page = 1;
  render();
}

function render(){
  const total = filtered.length;
  const start = (page-1)*PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageRows = filtered.slice(start, end);
  document.getElementById('tablewrap').innerHTML = buildTable(pageRows);
  document.getElementById('stats').textContent = `${total} 筆`;
  const maxp = Math.max(1, Math.ceil(total/PAGE_SIZE));
  document.getElementById('pageinfo').textContent = `${page} / ${maxp}`;
  document.getElementById('prev').disabled = page<=1;
  document.getElementById('next').disabled = page>=maxp;
  document.getElementById('pagejump').max = maxp;
  document.getElementById('pagejump').value = page;

  document.querySelectorAll('.ability').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      if(!key) return;
      selectedAbilities.add(key);
      document.querySelectorAll('.chip').forEach(ch => { if(ch.dataset.key===key) ch.classList.add('active'); });
      if(mode!=='ability'){ document.getElementById('mode').value='ability'; setMode('ability'); }
      update();
    });
  });
}

function setMode(m){
  mode = m;
  document.getElementById('nameBox').style.display = (m==='name') ? '' : 'none';
  document.getElementById('abilityBox').style.display = (m==='ability') ? '' : 'none';
  update();
}

document.addEventListener('DOMContentLoaded', () => {
  const sheetSel = document.getElementById('sheet');
  (DATA.sheetNames||[]).forEach(n => { const opt=document.createElement('option'); opt.value=n; opt.textContent=n; sheetSel.appendChild(opt); });
  sheetSel.value = activeSheet || '';
  sheetSel.addEventListener('change', e => {
    activeSheet = e.target.value;
    const rows = DATA.sheets[activeSheet] || [];
    const cols = rows.length ? Object.keys(rows[0]) : [];
    buildAbilityList(cols);
    selectedAbilities.clear();
    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    update();
  });

  document.getElementById('mode').addEventListener('change', e => setMode(e.target.value));
  document.getElementById('q').addEventListener('input', () => { clearTimeout(window._timer); window._timer=setTimeout(update,180); });
  document.getElementById('clear').addEventListener('click', () => {
    document.getElementById('q').value = '';
    selectedAbilities.clear();
    document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
    update();
  });
  document.getElementById('logic').addEventListener('change', e => { logicMode = e.target.value; update(); });

  document.getElementById('prev').addEventListener('click', () => { if(page>1){ page -= 1; render(); }});
  document.getElementById('next').addEventListener('click', () => {
    const maxp = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
    if(page < maxp){ page += 1; render(); }
  });
  document.getElementById('go').addEventListener('click', () => {
    const maxp = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
    let to = parseInt(document.getElementById('pagejump').value || '1', 10);
    if(Number.isNaN(to)) to = 1;
    to = Math.min(Math.max(1, to), maxp);
    if(to !== page){ page = to; render(); }
  });

  const rows0 = DATA.sheets[activeSheet] || [];
  const cols0 = rows0.length ? Object.keys(rows0[0]) : [];
  buildAbilityList(cols0);
  update();
});
</script>
